services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-gdd_wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-gdd_wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-gdd_wp_password}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-gdd_root_password}
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    # Kopiuj mu-pluginy z obrazu (/opt/mu-plugins) do volume przy kazdym
    # starcie, zanim Apache wystartuje. Nie polegamy na pre.d (bywa
    # ignorowany) ani na host-mountcie (montuje pusty katalog).
    command:
      - sh
      - -c
      - "cp -rf /opt/mu-plugins/. /var/www/html/wp-content/mu-plugins/ 2>/dev/null; exec docker-entrypoint.sh apache2-foreground"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-gdd_wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-gdd_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-gdd_wp_password}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', false);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_html:/var/www/html
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    # Serwer Node nasłuchuje na 4321 wewnątrz kontenera.
    # Healthcheck musi badać TEN port przy użyciu narzędzia dostępnego
    # w obrazie node (php nie istnieje w `node:22-bookworm-slim`).
    # Błędny healthcheck (php + port 80) zawsze failuje -> Coolify widzi
    # serwis jako unhealthy i nie wystawia go przez proxy ("no available server").
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # W sieci Docker Astro woła WP po nazwie serwisu
        WP_API_URL: http://wordpress/wp-json
        PUBLIC_WP_SITE_URL: https://administracja.gospodadobregodzwieku.pl
        PUBLIC_SITE_URL: https://gospodadobregodzwieku.pl
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    healthcheck:
      # Node słucha na 4321 (nie na 80!) i to jest port badany przez proxy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.exit(require('net').connect(4321,'127.0.0.1').on('error',()=>process.exit(1)).on('connect',function(){this.end();process.exit(0);})?'0':'1')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${WEB_PORT:-4321}:4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      WP_API_URL: http://wordpress/wp-json
      PUBLIC_WP_SITE_URL: https://administracja.gospodadobregodzwieku.pl
      PUBLIC_SITE_URL: https://gospodadobregodzwieku.pl
      WP_DEBUG_FETCH: ${WP_DEBUG_FETCH:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_WPROWADZENIE_DZWIEKU: ${STRIPE_PRICE_WPROWADZENIE_DZWIEKU:-}
      STRIPE_PRICE_INSTRUMENTALNE_ABC: ${STRIPE_PRICE_INSTRUMENTALNE_ABC:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      DOWNLOAD_TOKEN_TTL_HOURS: ${DOWNLOAD_TOKEN_TTL_HOURS:-48}
    volumes:
      - astro_data:/app/.data
      - /data/gdd-publications:/app/private/audiobooks:ro

volumes:
  wordpress_db:
  wordpress_html:
  astro_data:
